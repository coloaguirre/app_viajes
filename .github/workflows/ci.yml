name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build, lint and JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/dev' }}
      - name: Build, lint and test
        run: ./gradlew --no-daemon lint test assembleDebug
      - name: 16 KB page-size check
        run: ./tools/check-16kb.sh app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

  python:
    name: Python subprojects (uv + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Run pytest where a pyproject exists
        run: |
          ran=0
          for proj in desktop-renderer tools/gpx-replay; do
            if [ -f "$proj/pyproject.toml" ]; then
              echo "== $proj"; (cd "$proj" && uv run ruff check . && uv run pytest -q); ran=1
            fi
          done
          [ $ran -eq 1 ] || echo "no Python subprojects yet"
