# The dev machine has 7 GB shared with the emulator (2 GB): keep the build
# daemons small. Measured 2026-10-12: Gradle daemon grew to 3.2 GB at -Xmx3g.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xmx1g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
