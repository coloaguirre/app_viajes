[project]
name = "bitacora-render"
version = "0.1.0"
description = "Renderizador de escritorio del video resumen de Bitácora de Viaje (DISENO §13.5)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.1",
    "pydantic>=2.14.1",
    "requests>=2.34.2",
    "typer>=0.27.3",
]

[project.scripts]
bitacora-render = "bitacora_render.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bitacora_render"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"bitacora_render/cli.py" = ["B008"]  # typer declares options in defaults by design

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
